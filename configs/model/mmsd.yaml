name: MMSD

model:
  _target_: pl_modules.mmsd.MMSD
  encoder:
    _target_: models.mmfusion.MMFusion
    embed_dim: ${oc.select:embed_dim,512}
    fusion: "concat"    # 'x-attn' does not construct in this repo
    pool: "cls"
    n_heads: 8
    n_layers: 1
    add_bias_kv: False
    dropout: 0

  projection:
    _target_: pl_modules.mmsd.MMSD._build_mlp
    in_dim: ${model.model.encoder.embed_dim}
    mlp_dim: 512
    out_dim: 256

  loss_kwargs:
    objective: "dino"              # 'dino' | 'jepa'
    weights: null                  # per-mask weights; null = uniform
    # dino only
    student_temp: 0.1
    teacher_temp: 0.07
    warmup_teacher_temp: 0.04
    warmup_teacher_temp_frac: 0.3
    center_momentum: 0.9
    out_dim: 2048                  # prototypes; shrink for narrow embeddings
    # jepa only
    huber_delta: 1.0

  ema_base: 0.996
  ema_final: 1.0

  # Self-distillation schedules; the WoMM cells have none of these.
  lr_warmup_frac: 0.1
  wd_mult_end: 10.0                # multiplies optim.weight_decay; null keeps it flat
  freeze_last_layer_epochs: 1      # dino only

  # Keys differ per objective, so setting one needs Hydra's append form:
  #   +model.model.predictor_kwargs.depth=3
  predictor_kwargs: {}

  cross_view: null                 # null = each objective's own default

  mask_kwargs:                     # jepa only
    mode: "block"                  # 'block' on a square token grid, 'span' otherwise
    n_targets: 4
    target_scale: [0.15, 0.20]
    target_aspect: [0.75, 1.50]
    context_scale: [0.85, 1.00]
