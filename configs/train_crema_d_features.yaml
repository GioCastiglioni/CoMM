seed: 42
mode: "train"

# Same pipeline as the MultiBench affect sets, but not their 40-d width: the inputs
# here are LeVJEPA 1024-d and BYOL-A 512-d, so 40 would be a 25x squeeze against the
# 7.5x the affect text sees. 120 keeps it comparable and stays divisible by 5, so
# appendix B.1's 5-head / 5-layer block carries over unchanged.
embed_dim: 120

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: "auto"
  strategy: "auto"
  devices: "auto"
  num_nodes: 1
  max_epochs: 100
  default_root_dir: "."
  use_distributed_sampler: false
  deterministic: false
  inference_mode: false # avoid weird bugs during linear probing

linear_probing:
  _target_: evaluation.linear_probe.LinearProbingCallback
  use_sklearn: false
  fastsearch: false
  logging_level: "INFO"
  frequency: "by_epoch"
  every_n_epochs: 1

optim:
  lr: 1e-3
  weight_decay: 1e-2

crema_d_features:
  # One Transformer per modality, as in the affect datasets: 5 layers, 5 heads, and
  # no latent converter, since the encoder already returns a sequence at fusion width.
  encoders:
    - _target_: models.transformer.Transformer
      n_features: 1024   # LeVJEPA embed_dim
      dim: ${embed_dim}
      max_seq_length: 16 # one token per sampled frame
      positional_encoding: false
      n_heads: 5
      n_layers: 5
    - _target_: models.transformer.Transformer
      n_features: 512    # BYOL-A feature_d
      dim: ${embed_dim}
      max_seq_length: 25 # 32000 samples / hop 160 / 2^3 pools
      positional_encoding: false
      n_heads: 5
      n_layers: 5
  adapters:
    - null
    - null
