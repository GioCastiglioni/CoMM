seed: 42
mode: "train"

# Fusion width. Wider than MultiBench's 40 because the inputs are wider too:
# LeVJEPA gives 1024-d video tokens and BYOL-A 512-d audio frames, against
# 20-371 d in the affect datasets. The encoder *family* is the same (a small
# Transformer over pre-extracted features, no latent converter), which is what
# keeps a loss comparison from being a comparison of encoder capacity; set this
# to 40 for strict MultiBench parity at the cost of a hard squeeze on the input.
embed_dim: 256

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: "auto"
  strategy: "auto"
  devices: "auto"
  num_nodes: 1
  max_epochs: 100
  default_root_dir: "."
  use_distributed_sampler: false
  deterministic: false
  inference_mode: false # avoid weird bugs during linear probing

linear_probing:
  _target_: evaluation.linear_probe.LinearProbingCallback
  use_sklearn: false
  fastsearch: true
  logging_level: "INFO"
  frequency: "by_epoch"
  every_n_epochs: 1

optim:
  lr: 1e-3
  weight_decay: 1e-2

crema_d_features:
  # One Transformer per modality, as for the MultiBench affect datasets: 5 layers
  # and 5 heads, no latent converter, since the encoder already returns a sequence
  # whose width equals the fusion width.
  encoders:
    - _target_: models.transformer.Transformer
      n_features: 1024   # LeVJEPA embed_dim
      dim: ${embed_dim}
      max_seq_length: 16 # one token per sampled frame
      positional_encoding: false
      n_heads: 8          # 256 is not divisible by MultiBench's 5 heads
      n_layers: 5
    - _target_: models.transformer.Transformer
      n_features: 512    # BYOL-A feature_d
      dim: ${embed_dim}
      max_seq_length: 25 # 32000 samples / hop 160 / 2^3 pools
      positional_encoding: false
      n_heads: 8
      n_layers: 5
  adapters:
    - null
    - null
