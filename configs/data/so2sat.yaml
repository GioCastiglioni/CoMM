name: "so2sat"

data_module:
  _target_: dataset.so2sat.So2SatDataModule
  # Native resolution: the ViT encoders tokenise 32x32 directly, so nothing is
  # upsampled. `Resize(32)` on a 32x32 patch is a no-op and is kept only so the
  # data module stays usable at other sizes.
  image_size: 32
  batch_size: 64
  num_workers: 4
